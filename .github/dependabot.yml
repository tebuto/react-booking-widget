version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: main
    schedule:
      interval: "yearly"
    open-pull-requests-limit: 10
    assignees:
      - "jonasscholl"
    groups:
      dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
        # 2026-08-23: left on 6.x — @rollup/plugin-typescript breaks on TS 7 (rollup build: Cannot read properties of undefined reading 'ES2015')
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "yearly"
    open-pull-requests-limit: 5
    assignees:
      - "JonasScholl"
    groups:
      github-actions:
        patterns:
          - "*"
